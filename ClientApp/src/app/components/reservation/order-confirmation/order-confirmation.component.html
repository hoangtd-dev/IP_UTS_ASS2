<div class="min-h-screen bg-gray-50 pt-20 px-4 sm:px-6 lg:px-8">
  <div class="max-w-3xl mx-auto">
    <!-- Success Message -->
    <div class="text-center mb-12">
      <h1 class="text-3xl font-bold text-green-500 mb-2">
        Reservation Confirmed!
      </h1>
      <p class="text-lg text-gray-600">
        Thank you for choosing our service. Your reservation has been
        successfully processed.
      </p>
    </div>

    <!-- Order Summary -->
    <div class="bg-white rounded-xl shadow-lg overflow-hidden">
      <!-- Car Information -->
      <div class="p-6 border-b border-gray-200">
        <h2 class="text-xl font-semibold text-gray-900 mb-4">Car Details</h2>
        @if (car) {
        <div class="flex flex-col md:flex-row gap-6">
          <div class="w-full md:w-1/3">
            <img
              [src]="car.imageUrl"
              [alt]="car.name"
              class="w-full h-48 object-cover rounded-lg"
            />
          </div>
          <div class="w-full md:w-2/3">
            <h3 class="text-lg font-semibold text-gray-900">{{ car.name }}</h3>
            <div class="mt-2 space-y-1">
              <p class="text-gray-600">
                <span class="font-medium">Brand:</span> {{ car.carBrand?.name }}
              </p>
              <p class="text-gray-600">
                <span class="font-medium">Type:</span> {{ car.carType?.name }}
              </p>
              <p class="text-gray-600">
                <span class="font-medium">Year:</span>
                {{ car.yearOfManufacture }}
              </p>
              <p class="text-gray-600">
                <span class="font-medium">Mileage:</span> {{ car.mileage }} km
              </p>
            </div>
          </div>
        </div>
        }
      </div>
    </div>
  </div>
</div>
